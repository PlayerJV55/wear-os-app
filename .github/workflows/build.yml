name: Build Wear OS Flashlight APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar arquivos do projeto
        run: |
          mkdir -p app/src/main/java/com/example/wearflashlight
          mkdir -p app/src/main/res/layout

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WearFlashlight"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.wearflashlight"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.wearflashlight"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  debug {
                      isDebuggable = false
                      isMinifyEnabled = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  release {
                      isMinifyEnabled = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig = false
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.wear:wear:1.3.0")
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          # Regras básicas - o app não usa reflexão nem libs externas complexas
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.type.watch"
                  android:required="true" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_menu_camera"
                  android:label="Lanterna"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <meta-data
                      android:name="com.google.android.wearable.standalone"
                      android:value="true" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.wear.widget.BoxInsetLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFFFFF"
              android:focusable="true"
              android:focusableInTouchMode="true">

              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:boxedEdges="all">

                  <TextView
                      android:id="@+id/timerText"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:visibility="gone" />

                  <TextView
                      android:id="@+id/brightnessIndicator"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|center_horizontal"
                      android:layout_marginBottom="20dp"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:visibility="gone" />

              </FrameLayout>

              <ScrollView
                  android:id="@+id/settingsOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#F2101010"
                  android:visibility="gone"
                  android:scrollbars="none">

                  <LinearLayout
                      android:id="@+id/settingsContainer"
                      android:orientation="vertical"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingLeft="14dp"
                      android:paddingRight="14dp"
                      android:paddingTop="10dp"
                      android:paddingBottom="10dp" />

              </ScrollView>

          </androidx.wear.widget.BoxInsetLayout>
          EOF

          cat > app/src/main/java/com/example/wearflashlight/MainActivity.kt << 'EOF'
          package com.example.wearflashlight

          import android.app.Activity
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.InputDevice
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import androidx.wear.widget.BoxInsetLayout

          class MainActivity : Activity() {

              data class ColorOption(val name: String, val color: Int)

              private val colorOptions = listOf(
                  ColorOption("Branco", Color.parseColor("#FFFFFF")),
                  ColorOption("Vermelho", Color.parseColor("#FF3B30")),
                  ColorOption("Verde", Color.parseColor("#34C759")),
                  ColorOption("Azul", Color.parseColor("#0A84FF")),
                  ColorOption("Radar", Color.parseColor("#FFB300")),
                  ColorOption("Ultravioleta", Color.parseColor("#8F00FF")),
                  ColorOption("Cinza", Color.parseColor("#9E9E9E")),
                  ColorOption("Preto", Color.parseColor("#000000"))
              )

              private val timerOptions = listOf(0, 1, 3, 5, 10, 15, 20)

              private val ACCENT = Color.parseColor("#29B6F6")

              private lateinit var prefs: SharedPreferences
              private lateinit var rootLayout: BoxInsetLayout
              private lateinit var timerText: TextView
              private lateinit var brightnessIndicator: TextView
              private lateinit var settingsOverlay: ScrollView

              private var countDownTimer: CountDownTimer? = null
              private val handler = Handler(Looper.getMainLooper())
              private var brightnessHideRunnable: Runnable? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  prefs = getSharedPreferences("flashlight_prefs", Context.MODE_PRIVATE)

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )
                  window.attributes = window.attributes.apply {
                      screenBrightness = prefs.getFloat("brightness", 1f)
                  }

                  setContentView(R.layout.activity_main)

                  rootLayout = findViewById(R.id.rootLayout)
                  timerText = findViewById(R.id.timerText)
                  brightnessIndicator = findViewById(R.id.brightnessIndicator)
                  settingsOverlay = findViewById(R.id.settingsOverlay)

                  timerText.background = roundedDrawable(Color.argb(160, 0, 0, 0), 20)
                  timerText.setPadding(dp(18), dp(8), dp(18), dp(8))

                  brightnessIndicator.background = roundedDrawable(Color.argb(170, 0, 0, 0), 20)
                  brightnessIndicator.setPadding(dp(16), dp(6), dp(16), dp(6))

                  applyColor(getSavedColorName())
                  updateTimerVisibility()
                  startAutoCloseTimerIfNeeded()

                  rootLayout.isFocusableInTouchMode = true
                  rootLayout.requestFocus()

                  rootLayout.setOnLongClickListener {
                      toggleSettings()
                      true
                  }

                  settingsOverlay.setOnLongClickListener {
                      toggleSettings()
                      true
                  }

                  rootLayout.setOnGenericMotionListener { _, event ->
                      if (event.action == MotionEvent.ACTION_SCROLL &&
                          event.isFromSource(InputDevice.SOURCE_ROTARY_ENCODER) &&
                          settingsOverlay.visibility != View.VISIBLE
                      ) {
                          val delta = event.getAxisValue(MotionEvent.AXIS_SCROLL)
                          adjustBrightness(delta)
                          true
                      } else {
                          false
                      }
                  }
              }

              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

              private fun roundedDrawable(
                  fillColor: Int,
                  radiusDp: Int,
                  strokeColor: Int? = null,
                  strokeWidthDp: Int = 0
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = dp(radiusDp).toFloat()
                      setColor(fillColor)
                      if (strokeColor != null) {
                          setStroke(dp(strokeWidthDp), strokeColor)
                      }
                  }
              }

              private fun getSavedColorName(): String =
                  prefs.getString("color", "Branco") ?: "Branco"

              private fun getSavedTimerSeconds(): Int =
                  prefs.getInt("timerSeconds", 0)

              private fun getSavedShowTimer(): Boolean =
                  prefs.getBoolean("showTimer", true)

              private fun applyColor(name: String) {
                  val option = colorOptions.find { it.name == name } ?: colorOptions[0]
                  rootLayout.setBackgroundColor(option.color)
                  prefs.edit().putString("color", option.name).apply()
              }

              private fun updateTimerVisibility() {
                  val seconds = getSavedTimerSeconds()
                  timerText.visibility =
                      if (seconds > 0 && getSavedShowTimer()) View.VISIBLE else View.GONE
              }

              private fun startAutoCloseTimerIfNeeded() {
                  countDownTimer?.cancel()
                  val seconds = getSavedTimerSeconds()
                  if (seconds <= 0) {
                      timerText.text = ""
                      return
                  }
                  countDownTimer = object : CountDownTimer(seconds * 1000L, 1000L) {
                      override fun onTick(millisUntilFinished: Long) {
                          val secondsLeft = (millisUntilFinished / 1000) + 1
                          timerText.text = "$secondsLeft"
                      }

                      override fun onFinish() {
                          finish()
                      }
                  }.start()
              }

              private fun adjustBrightness(delta: Float) {
                  var brightness = prefs.getFloat("brightness", 1f)
                  brightness = (brightness + delta * 0.25f).coerceIn(0.05f, 1f)
                  prefs.edit().putFloat("brightness", brightness).apply()
                  window.attributes = window.attributes.apply { screenBrightness = brightness }

                  val percent = (brightness * 100).toInt()
                  brightnessIndicator.text = "Brilho $percent%"
                  brightnessIndicator.visibility = View.VISIBLE

                  brightnessHideRunnable?.let { handler.removeCallbacks(it) }
                  val hideRunnable = Runnable { brightnessIndicator.visibility = View.GONE }
                  brightnessHideRunnable = hideRunnable
                  handler.postDelayed(hideRunnable, 1200)
              }

              private fun toggleSettings() {
                  if (settingsOverlay.visibility == View.VISIBLE) {
                      settingsOverlay.visibility = View.GONE
                      startAutoCloseTimerIfNeeded()
                  } else {
                      countDownTimer?.cancel()
                      buildSettingsUI()
                      settingsOverlay.visibility = View.VISIBLE
                  }
              }

              private fun sectionTitle(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      setTextColor(Color.parseColor("#AAAAAA"))
                      textSize = 12f
                      setPadding(dp(10), dp(16), dp(10), dp(6))
                      setTypeface(typeface, Typeface.BOLD)
                  }
              }

              private fun createColorRow(option: ColorOption, isSelected: Boolean): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(dp(2), dp(4), dp(2), dp(4)) }
                      background = roundedDrawable(
                          if (isSelected) Color.parseColor("#2A2A2A") else Color.parseColor("#1C1C1C"),
                          22
                      )
                      isClickable = true
                      isFocusable = true
                  }

                  val circle = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(30), dp(30))
                      background = roundedDrawable(
                          option.color, 15,
                          if (isSelected) ACCENT else null,
                          if (isSelected) 2 else 0
                      )
                  }

                  val label = TextView(this).apply {
                      text = option.name
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setPadding(dp(14), 0, 0, 0)
                      layoutParams = LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f
                      )
                  }

                  val check = TextView(this).apply {
                      text = if (isSelected) "✓" else ""
                      setTextColor(ACCENT)
                      textSize = 18f
                      setTypeface(typeface, Typeface.BOLD)
                  }

                  row.addView(circle)
                  row.addView(label)
                  row.addView(check)

                  row.setOnClickListener {
                      applyColor(option.name)
                      buildSettingsUI()
                  }

                  return row
              }

              private fun createTimerRow(seconds: Int, isSelected: Boolean): View {
                  val label = if (seconds == 0) "Desligado" else "$seconds segundos"

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(dp(2), dp(4), dp(2), dp(4)) }
                      background = roundedDrawable(
                          if (isSelected) ACCENT else Color.parseColor("#1C1C1C"),
                          22
                      )
                      isClickable = true
                      isFocusable = true
                  }

                  val labelView = TextView(this).apply {
                      text = label
                      setTextColor(if (isSelected) Color.BLACK else Color.WHITE)
                      textSize = 15f
                      layoutParams = LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f
                      )
                  }

                  row.addView(labelView)

                  row.setOnClickListener {
                      prefs.edit().putInt("timerSeconds", seconds).apply()
                      buildSettingsUI()
                  }

                  return row
              }

              private fun buildSettingsUI() {
                  val container = settingsOverlay.findViewById<LinearLayout>(R.id.settingsContainer)
                  container.removeAllViews()

                  val header = TextView(this).apply {
                      text = "Configurações"
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      gravity = Gravity.CENTER
                      setPadding(dp(10), dp(26), dp(10), dp(6))
                      setTypeface(typeface, Typeface.BOLD)
                  }
                  container.addView(header)

                  container.addView(sectionTitle("Cor"))
                  val currentColor = getSavedColorName()
                  colorOptions.forEach { option ->
                      container.addView(createColorRow(option, option.name == currentColor))
                  }

                  container.addView(sectionTitle("Temporizador"))
                  val currentTimer = getSavedTimerSeconds()
                  timerOptions.forEach { seconds ->
                      container.addView(createTimerRow(seconds, seconds == currentTimer))
                  }

                  container.addView(sectionTitle("Exibição"))
                  val switchRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(dp(2), dp(4), dp(2), dp(4)) }
                      background = roundedDrawable(Color.parseColor("#1C1C1C"), 22)
                  }
                  val switchLabel = TextView(this).apply {
                      text = "Exibir timer na tela"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      layoutParams = LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f
                      )
                  }
                  val switchToggle = Switch(this).apply {
                      isChecked = getSavedShowTimer()
                      setOnCheckedChangeListener { _, checked ->
                          prefs.edit().putBoolean("showTimer", checked).apply()
                          updateTimerVisibility()
                      }
                  }
                  switchRow.addView(switchLabel)
                  switchRow.addView(switchToggle)
                  container.addView(switchRow)

                  val closeButton = TextView(this).apply {
                      text = "Fechar"
                      setTextColor(Color.BLACK)
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(dp(20), dp(20), dp(20), dp(26)) }
                      background = roundedDrawable(ACCENT, 24)
                      setOnClickListener { toggleSettings() }
                  }
                  container.addView(closeButton)
              }

              override fun onDestroy() {
                  countDownTimer?.cancel()
                  brightnessHideRunnable?.let { handler.removeCallbacks(it) }
                  super.onDestroy()
              }
          }
          EOF

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes necessários do Android SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
